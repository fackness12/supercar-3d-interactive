<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supercar 3D Interactive</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#eee;font:14px system-ui}.app{max-width:1250px;margin:auto;padding:12px}.layout{display:grid;grid-template-columns:1fr 330px;gap:12px}.stage{height:680px;border:1px solid #343a43;border-radius:18px;overflow:hidden;position:relative;background:radial-gradient(circle,#414750,#0b0d10 65%)}canvas{width:100%;height:100%;display:block}.hint{position:absolute;top:10px;left:10px;background:#101318dd;border:1px solid #363c46;padding:8px;border-radius:9px;font-size:11px}.panel{background:#111419;border:1px solid #30353e;border-radius:18px;padding:12px;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}button{background:#1b2028;color:#fff;border:1px solid #343b46;border-radius:9px;padding:9px;min-height:42px;font-weight:700}button:active{transform:scale(.98)}.card{background:#181c22;border:1px solid #30353e;border-radius:12px;padding:11px;margin-top:9px}.small{font-size:11px;color:#9da4ae}.name{font-size:19px;font-weight:800;margin:3px 0}.tag{display:inline-block;border:1px solid #414854;border-radius:7px;padding:3px 6px;font-size:10px;margin:2px}.parts{max-height:220px;overflow:auto;display:grid;gap:5px}p{line-height:1.4}@media(max-width:850px){.layout{grid-template-columns:1fr}.stage{height:480px}.panel{order:2}}</style>
<div class="app"><h2>🔧 Supercar 3D Interactive — V4 + V5</h2><div class="layout"><div class="stage"><div class="hint">👆 Touchez une pièce • glissez pour tourner • pince/roulette pour zoomer</div><canvas id="c"></canvas></div><aside class="panel"><div class="grid"><button id="exp">💥 Éclatée</button><button id="asm">↩ Remonter</button><button id="rm">🔧 Démonter</button><button id="run">▶ Fonctionner</button><button id="eng">🧠 Moteur ouvert</button><button id="reset">⟳ Reset</button></div><div class="card" id="info"><div class="small">INSPECTION</div><div class="name">Touchez une pièce</div><p>Rôle, fonctionnement, interactions, panne possible et état apparaissent ici.</p></div><div class="card"><div class="small">SYSTÈMES</div><div class="grid" id="systems"></div></div><div class="card"><div class="small">PIÈCES INTERNES</div><div class="parts" id="internals"></div></div></aside></div></div>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';
const cv=document.querySelector('#c'),st=document.querySelector('.stage'),r=new T.WebGLRenderer({canvas:cv,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;
const s=new T.Scene(),cam=new T.PerspectiveCamera(38,1,.1,100);s.add(new T.HemisphereLight(0xffffff,0x20242a,2));const dl=new T.DirectionalLight(0xffffff,3);dl.position.set(5,8,6);s.add(dl);
const mat={red:new T.MeshStandardMaterial({color:0x8b1520,metalness:.75,roughness:.23}),red2:new T.MeshStandardMaterial({color:0xc0212d,metalness:.7,roughness:.22}),black:new T.MeshStandardMaterial({color:0x090a0c,roughness:.65}),metal:new T.MeshStandardMaterial({color:0xbcc2c9,metalness:.95,roughness:.18}),dark:new T.MeshStandardMaterial({color:0x343a43,metalness:.75,roughness:.3}),gold:new T.MeshStandardMaterial({color:0xc39a4d,metalness:.9,roughness:.2}),glass:new T.MeshStandardMaterial({color:0x18303c,transparent:true,opacity:.55}),hi:new T.MeshStandardMaterial({color:0xffa0a0,emissive:0x650000,emissiveIntensity:.8})};
const car=new T.Group();s.add(car);let P=[],I=[],orig=new Map(),sel=null;

const gltfLoader=new GLTFLoader();
let lamborghini=null;
gltfLoader.load('./models/lamborghini.glb',
  (gltf)=>{
    lamborghini=gltf.scene;
    lamborghini.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
    const box=new T.Box3().setFromObject(lamborghini);
    const size=box.getSize(new T.Vector3());
    const center=box.getCenter(new T.Vector3());
    lamborghini.position.sub(center);
    const maxDim=Math.max(size.x,size.y,size.z);
    if(maxDim>0) lamborghini.scale.setScalar(5.2/maxDim);
    const box2=new T.Box3().setFromObject(lamborghini);
    lamborghini.position.y-=box2.min.y;
    car.add(lamborghini);
    P.forEach(g=>g.visible=false);
    I.forEach(g=>g.visible=false);
    console.log('✅ Lamborghini GLB chargée');
  },
  undefined,
  (err)=>console.error('❌ Erreur chargement ./models/lamborghini.glb',err)
);
function add(name,sys,geo,ma,pos,role,work,links,fault,internal=false){const g=new T.Group(),m=new T.Mesh(geo,ma);m.castShadow=true;g.add(m);g.position.set(...pos);g.userData={name,sys,role,work,links,fault,base:ma};g.visible=!internal;car.add(g);(internal?I:P).push(g);orig.set(g,{p:g.position.clone(),rot:g.rotation.clone()});return g}
const box=(n,sys,w,h,d,x,y,z,ma,role,work,links,fault)=>add(n,sys,new T.BoxGeometry(w,h,d),ma,[x,y,z],role,work,links,fault);
const cyl=(n,sys,rad,h,x,y,z,ma,role,work,links,fault)=>add(n,sys,new T.CylinderGeometry(rad,rad,h,24),ma,[x,y,z],role,work,links,fault);
box('Châssis','Châssis',5.3,.28,2.05,0,.55,0,mat.black,'Supporte la structure.','Répartit les charges et relie les organes.','Suspension, carrosserie, moteur.','Déformation ou corrosion.');
box('Cellule','Carrosserie',4.7,.72,1.9,0,1.12,0,mat.red,'Protège l’habitacle.','Rigidifie la structure centrale.','Châssis, portes, toit.','Déformation.');
box('Nez','Carrosserie',3.7,.45,.85,0,1.03,2.25,mat.red2,'Forme l’avant.','Guide l’air et protège les organes.','Châssis, radiateur, capot.','Choc.');
box('Toit','Carrosserie',2.6,.16,1.45,0,1.9,-.15,mat.red2,'Ferme la cellule.','Participe à la rigidité.','Cellule, vitrages.','Déformation.');
box('Pare-brise','Carrosserie',2.45,.48,.08,0,1.67,.68,mat.glass,'Assure la visibilité.','Protège tout en laissant voir.','Toit, cellule.','Fissure.');
box('Capot','Carrosserie',3.4,.14,1,0,1.38,1.62,mat.red2,'Accès moteur.','S’ouvre sur ses charnières.','Charnières, radiateur, batterie.','Verrou/charnière.');
box('Porte G','Carrosserie',4.35,.58,.11,-2.37,1.22,.05,mat.red2,'Accès habitacle.','Pivote sur ses charnières.','Cellule, serrure.','Jeu/serrure.');
box('Porte D','Carrosserie',4.35,.58,.11,2.37,1.22,.05,mat.red2,'Accès habitacle.','Pivote sur ses charnières.','Cellule, serrure.','Jeu/serrure.');
box('Bloc moteur','Moteur',1.9,.72,1.28,0,1.16,-1.02,mat.dark,'Transforme l’énergie en rotation.','Admission, compression, combustion puis échappement produisent le couple.','Pistons, bielles, vilebrequin, culasses.','Surchauffe/perte de puissance.');
box('Culasse G','Moteur',.72,.18,1.02,-.52,1.58,-1.02,mat.metal,'Ferme les cylindres.','Porte les soupapes et la distribution.','Soupapes, arbre à cames.','Fuite compression.');
box('Culasse D','Moteur',.72,.18,1.02,.52,1.58,-1.02,mat.metal,'Ferme les cylindres.','Contrôle les échanges de gaz.','Soupapes, arbre à cames.','Fuite.');
box('Admission','Moteur',1.15,.2,.58,0,1.68,-1.02,mat.gold,'Amène l’air.','Distribue l’air vers les cylindres.','Filtre, papillon, injecteurs.','Fuite/encrassement.');
box('Radiateur','Refroidissement',1.9,.7,.16,0,1.02,2.57,mat.metal,'Évacue la chaleur.','Le liquide chaud cède sa chaleur à l’air.','Pompe, ventilateur, durites.','Fuite/surchauffe.');
box('Batterie','Électricité',.62,.42,.76,1.05,1.15,1.38,mat.black,'Fournit l’électricité.','Stocke et délivre une tension.','Démarreur, alternateur, calculateurs.','Tension faible.');
box('Boîte de vitesses','Transmission',1.35,.58,.95,0,.9,-1.78,mat.dark,'Adapte couple et vitesse.','Les rapports modifient la transmission.','Embrayage, arbre, différentiel.','Bruits/rapports difficiles.');
cyl('Arbre transmission','Transmission',.11,2,0,.82,-.82,mat.metal,'Transmet le couple.','Tourne entre boîte et différentiel.','Boîte, différentiel.','Vibrations.');
box('Différentiel','Transmission',1,.55,.85,0,.78,-2.22,mat.dark,'Répartit le couple.','Permet des vitesses différentes entre roues.','Arbres, roues.','Bruits/à-coups.');
for(const [x,z,n]of[[-2.18,1.42,'AV G'],[2.18,1.42,'AV D'],[-2.18,-1.42,'AR G'],[2.18,-1.42,'AR D']]){cyl('Roue '+n,'Roues',.62,.36,x,.72,z,mat.black,'Met la voiture au sol.','Tourne autour du moyeu.','Moyeu, pneu, frein.','Usure/vibration.');cyl('Jante '+n,'Roues',.37,.39,x,.72,z,mat.metal,'Supporte le pneu.','Tourne avec le moyeu.','Pneu, disque.','Déformation.');cyl('Disque '+n,'Freins',.28,.4,x,.72,z,mat.metal,'Surface de friction.','Les plaquettes serrent le disque.','Étrier, plaquettes.','Usure/voilage.');box('Étrier '+n,'Freins',.16,.46,.22,x+(x<0?-.23:.23),.72,z,mat.gold,'Presse les plaquettes.','La pression hydraulique déplace le piston.','Liquide, plaquettes, disque.','Fuite/grippage.');cyl('Amortisseur '+n,'Suspension',.1,.72,x,1.02,z,mat.dark,'Contrôle les oscillations.','Dissipe l’énergie des mouvements.','Ressort, bras, caisse.','Fuite.');}
cyl('Échappement G','Échappement',.13,.65,-1.2,.96,-2.54,mat.metal,'Évacue les gaz.','Conduit les gaz brûlés vers l’extérieur.','Collecteurs, silencieux.','Fuite/bruit.');cyl('Échappement D','Échappement',.13,.65,1.2,.96,-2.54,mat.metal,'Évacue les gaz.','Conduit les gaz brûlés vers l’extérieur.','Collecteurs, silencieux.','Fuite/bruit.');
function internal(n,g,pos,role,work,links,fault){return add(n,'Moteur interne',g,mat.metal,pos,role,work,links,fault,true)}
for(let i=0;i<4;i++){internal('Piston '+(i+1),new T.CylinderGeometry(.18,.18,.34,20),[i%2?-.28:.28,1.15,-1.32+i*.2],'Se déplace dans le cylindre.','La combustion pousse le piston qui entraîne la bielle.','Bielle, cylindre, segments.','Compression faible.');internal('Bielle '+(i+1),new T.BoxGeometry(.1,.55,.1),[i%2?-.28:.28,.86,-1.32+i*.2],'Relie piston et vilebrequin.','Transmet l’effort alternatif au vilebrequin.','Piston, vilebrequin.','Jeu/déformation.');internal('Soupape '+(i+1),new T.CylinderGeometry(.045,.075,.3,16),[i%2?-.38:.38,1.78,-1.15+i*.08],'Contrôle les gaz.','S’ouvre et se ferme selon la distribution.','Arbre à cames, culasse.','Fuite/mauvais calage.');internal('Injecteur '+(i+1),new T.CylinderGeometry(.045,.065,.22,16),[i%2?-.38:.38,1.76,-.95+i*.08],'Dose le carburant.','Pulvérise une quantité contrôlée.','Rampe, calculateur.','Encrassement.')}
const crank=internal('Vilebrequin',new T.CylinderGeometry(.12,.12,1.9,20),[0,.95,-1.02],'Transforme le mouvement en rotation.','Les bielles font tourner l’arbre.','Bielles, volant, lubrification.','Usure/vibrations.');crank.rotation.z=Math.PI/2;
const cam=internal('Arbre à cames',new T.CylinderGeometry(.08,.08,1.8,20),[0,1.85,-1.02],'Commande les soupapes.','Les cames transforment la rotation en levée.','Soupapes, distribution.','Usure/calage.');cam.rotation.z=Math.PI/2;
const clutch=internal('Embrayage',new T.CylinderGeometry(.38,.38,.18,32),[0,.92,-1.48],'Couple moteur et boîte.','Le disque transmet le couple lorsqu’il est serré.','Volant moteur, boîte.','Patinage/vibrations.');clutch.rotation.z=Math.PI/2;
function show(p){const e=document.querySelector('#info');if(!p){e.innerHTML='<div class="small">INSPECTION</div><div class="name">Touchez une pièce</div><p>Les informations techniques apparaîtront ici.</p>';return}e.innerHTML='<div class="small">'+p.userData.sys+'</div><div class="name">'+p.userData.name+'</div><span class="tag">RÔLE</span><p>'+p.userData.role+'</p><span class="tag">FONCTIONNEMENT</span><p>'+p.userData.work+'</p><span class="tag">INTERACTIONS</span><p>'+p.userData.links+'</p><span class="tag">DIAGNOSTIC</span><p>⚠️ '+p.userData.fault+'</p><p><b>État :</b> '+(p.visible?'installée':'démontée')+'</p>}
function select(p){sel=p;[...P,...I].forEach(g=>g.children[0].material=g===p?mat.hi:g.userData.base);show(p)}
function reset(){if(lamborghini){lamborghini.visible=true;lamborghini.position.set(0,0,0);lamborghini.rotation.set(0,0,0)}[...P,...I].forEach(g=>{const o=orig.get(g);g.position.copy(o.p);g.rotation.copy(o.rot);g.visible=false});sel=null;show()}
function explode(){if(lamborghini){lamborghini.visible=true}P.forEach(g=>g.visible=false);I.forEach(g=>g.visible=false)}
function openEngine(){if(lamborghini)lamborghini.visible=true;P.forEach(g=>g.visible=false);I.forEach(g=>g.visible=true);show()}
document.querySelector('#reset').onclick=reset;document.querySelector('#asm').onclick=reset;document.querySelector('#exp').onclick=explode;document.querySelector('#eng').onclick=openEngine;
document.querySelector('#rm').onclick=()=>{if(sel&&sel!==lamborghini){sel.visible=false;show(sel)}};document.querySelector('#run').onclick=()=>{if(!sel)return;const g=sel,t=performance.now(),base=g.rotation.y;function a(n){const k=Math.min(1,(n-t)/1600);g.rotation.y=base+Math.sin(k*Math.PI*8)*.45;if(k<1)requestAnimationFrame(a)}requestAnimationFrame(a)};
[...new Set(P.map(x=>x.userData.sys))].forEach(sys=>{const b=document.createElement('button');b.textContent=sys;b.onclick=()=>{P.forEach(g=>g.visible=g.userData.sys===sys||g.userData.sys==='Châssis');I.forEach(g=>g.visible=false);show()};document.querySelector('#systems').append(b)});
I.forEach(g=>{const b=document.createElement('button');b.textContent=g.userData.name;b.onclick=()=>{openEngine();select(g)};document.querySelector('#internals').append(b)});
const ray=new T.Raycaster(),mouse=new T.Vector2();let drag=false,lx=0,ly=0,down=0,ry=.7,rx=.12,dist=8.5;
cv.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;down=Date.now()};cv.onpointermove=e=>{if(!drag)return;ry+=(e.clientX-lx)*.01;rx=Math.max(-.55,Math.min(.55,rx+(e.clientY-ly)*.007));lx=e.clientX;ly=e.clientY};cv.onpointerup=e=>{drag=false;if(Date.now()-down>180)return;const q=cv.getBoundingClientRect();mouse.x=(e.clientX-q.left)/q.width*2-1;mouse.y=-(e.clientY-q.top)/q.height*2+1;ray.setFromCamera(mouse,cam);const a=[...P,...I].filter(x=>x.visible);if(lamborghini&&lamborghini.visible){const mh=ray.intersectObject(lamborghini,true);if(mh.length){show({userData:{sys:'Lamborghini',name:mh[0].object.name||'Pièce du modèle',role:'Élément du modèle 3D.',work:'Modèle chargé depuis le fichier GLB.',links:'Voir les nœuds du modèle GLB.',fault:'Diagnostic détaillé non défini pour ce nœud.'}});return}}const h=ray.intersectObjects(a.flatMap(x=>x.children));if(h[0])select(a.find(x=>x.children.includes(h[0].object)))};
cv.onwheel=e=>{e.preventDefault();dist=Math.max(5,Math.min(14,dist+e.deltaY*.008))};
function resize(){const w=st.clientWidth,h=st.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}new ResizeObserver(resize).observe(st);resize();
function loop(){requestAnimationFrame(loop);car.rotation.y=ry;car.rotation.x=rx;cam.position.set(0,3.5,dist);cam.lookAt(0,1.05,0);r.render(s,cam)}loop();
</script>
